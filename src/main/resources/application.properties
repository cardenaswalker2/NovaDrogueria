spring.application.name=novadrogueria

# MongoDB configuration
spring.data.mongodb.uri=mongodb://localhost:27017/novadrogueria

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Logging configuration
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=INFO

# Application Admin Default Properties (fallback for development)
novadrogueria.admin.username=${ADMIN_USERNAME:admin}
novadrogueria.admin.password=${ADMIN_PASSWORD:admin123}
