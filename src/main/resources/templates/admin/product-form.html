<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Registrar Producto')}">
</head>
<body>

    <aside th:replace="~{fragments/admin-layout :: sidebar('products')}"></aside>

    <main class="main-content">
        <h1 style="font-size: 2.25rem; font-weight: 700; color: #0f172a; margin-bottom: 2rem;" 
            th:text="${productDTO.id == null ? 'Registrar Producto' : 'Editar Producto'}"></h1>

        <div th:if="${errorMessage != null}" class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="card">
            <form th:action="${productDTO.id == null ? '/admin/productos/crear' : '/admin/productos/editar/' + productDTO.id}" th:object="${productDTO}" method="post">
                <input type="hidden" th:field="*{id}">

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
                    
                    <!-- Name -->
                    <div class="form-group">
                        <label for="name" class="form-label">Nombre del Producto *</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Ej. Acetaminofén 500 mg" oninput="generateSlug(this.value)">
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.35rem;"></p>
                    </div>

                    <!-- Slug -->
                    <div class="form-group">
                        <label for="slug" class="form-label">Dirección Web (Slug) *</label>
                        <input type="text" id="slug" th:field="*{slug}" class="form-control" placeholder="ej-acetaminofen-500mg">
                        <p th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.35rem;"></p>
                    </div>

                    <!-- Category -->
                    <div class="form-group">
                        <label for="categoryId" class="form-label">Categoría *</label>
                        <select id="categoryId" th:field="*{categoryId}" class="form-control">
                            <option value="">Seleccione una categoría</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                        </select>
                        <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.35rem;"></p>
                    </div>

                    <!-- Brand -->
                    <div class="form-group">
                        <label for="brand" class="form-label">Marca / Laboratorio *</label>
                        <input type="text" id="brand" th:field="*{brand}" class="form-control" placeholder="Ej. Genfar">
                        <p th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.35rem;"></p>
                    </div>

                    <!-- Active Ingredient -->
                    <div class="form-group">
                        <label for="activeIngredient" class="form-label">Principio Activo (Opcional)</label>
                        <input type="text" id="activeIngredient" th:field="*{activeIngredient}" class="form-control" placeholder="Ej. Acetaminofén">
                    </div>

                    <!-- Presentation -->
                    <div class="form-group">
                        <label for="presentation" class="form-label">Presentación *</label>
                        <input type="text" id="presentation" th:field="*{presentation}" class="form-control" placeholder="Ej. Caja x 100 tabletas">
                        <p th:if="${#fields.hasErrors('presentation')}" th:errors="*{presentation}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.35rem;"></p>
                    </div>

                    <!-- Price -->
                    <div class="form-group">
                        <label for="price" class="form-label">Precio de Venta ($) *</label>
                        <input type="number" id="price" th:field="*{price}" step="0.01" class="form-control" placeholder="0.00" oninput="updateLivePricePreview(this.value)">
                        <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.35rem;"></p>
                        <!-- Live preview info box -->
                        <div id="price-preview-box" style="margin-top: 0.5rem; background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 0.75rem; border-radius: 0.5rem; display: none;">
                            <strong id="price-preview-formatted" style="color: #0d9488; font-size: 1rem; display: block;"></strong>
                            <span id="price-preview-words" style="color: #64748b; font-size: 0.8rem; font-weight: 500; display: block; line-height: 1.3; margin-top: 0.15rem;"></span>
                        </div>
                    </div>

                    <!-- Stock -->
                    <div class="form-group">
                        <label for="stock" class="form-label">Stock de Inventario *</label>
                        <input type="number" id="stock" th:field="*{stock}" class="form-control" placeholder="0">
                        <p th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.35rem;"></p>
                    </div>

                    <!-- Image Url -->
                    <div class="form-group">
                        <label for="imageUrl" class="form-label">URL de la Imagen</label>
                        <input type="text" id="imageUrl" th:field="*{imageUrl}" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description" class="form-label">Descripción del Producto *</label>
                    <textarea id="description" th:field="*{description}" rows="3" class="form-control" placeholder="Detalle comercial del producto..."></textarea>
                    <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.35rem;"></p>
                </div>

                <!-- Technical Specs and warnings -->
                <div class="form-group">
                    <label for="additionalInfo" class="form-label">Indicaciones / Dosificación Informativa</label>
                    <textarea id="additionalInfo" th:field="*{additionalInfo}" rows="2" class="form-control" placeholder="Información provista en el empaque (opcional)..."></textarea>
                </div>

                <div class="form-group">
                    <label for="warnings" class="form-label">Contraindicaciones y Advertencias</label>
                    <textarea id="warnings" th:field="*{warnings}" rows="2" class="form-control" placeholder="Ej. Manténgase fuera del alcance de los niños..."></textarea>
                </div>

                <!-- Features checks -->
                <div style="display: flex; gap: 2rem; margin-bottom: 2rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 500; cursor: pointer;">
                        <input type="checkbox" th:field="*{featured}"> Destacar producto en portada
                    </label>

                    <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 500; cursor: pointer;">
                        <input type="checkbox" th:field="*{active}"> Producto activo
                    </label>
                </div>

                <div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Producto
                    </button>
                    <a href="/admin/productos" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function generateSlug(text) {
            // Slug helper generator in browser
            var slug = text.toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
            document.getElementById('slug').value = slug;
        }

        function updateLivePricePreview(val) {
            const box = document.getElementById("price-preview-box");
            const fmtSpan = document.getElementById("price-preview-formatted");
            const wordsSpan = document.getElementById("price-preview-words");
            
            if (!val || isNaN(val) || parseFloat(val) < 0) {
                box.style.display = "none";
                return;
            }
            
            const num = parseFloat(val);
            
            // Format Colombian currency
            const formatter = new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: num % 1 === 0 ? 0 : 2,
                maximumFractionDigits: 2
            });
            
            let formatted = formatter.format(num);
            // Replace COP suffix/prefix if any
            formatted = formatted.replace("COP", "").trim();
            if (!formatted.startsWith("$")) {
                formatted = "$" + formatted;
            }
            
            fmtSpan.textContent = "Vista previa: " + formatted;
            
            // Translate to words (simplistic JS converter matching the rules)
            wordsSpan.textContent = translateToWords(num);
            box.style.display = "block";
        }

        function translateToWords(num) {
            const UNIDADES = ["", "un", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
            const DECENAS = ["", "diez", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
            const ONCE_A_DIECINUEVE = ["diez", "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve"];
            const VEINTES = ["veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro", "veinticinco", "veintiséis", "veintitrés", "veintiocho", "veintinueve"];
            const CENTENAS = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
            
            function convert(n) {
                if (n === 0) return "";
                if (n < 10) return UNIDADES[n];
                if (n < 20) return ONCE_A_DIECINUEVE[n - 10];
                if (n < 30) {
                    if (n === 20) return "veinte";
                    let u = UNIDADES[n % 10];
                    if (u === "un") return "veintiún";
                    return VEINTES[n - 20];
                }
                if (n < 100) {
                    let d = Math.floor(n / 10);
                    let u = n % 10;
                    if (u === 0) return DECENAS[d];
                    return DECENAS[d] + " y " + UNIDADES[u];
                }
                if (n < 1000) {
                    if (n === 100) return "cien";
                    let c = Math.floor(n / 100);
                    let r = n % 100;
                    if (r === 0) return CENTENAS[c];
                    return CENTENAS[c] + " " + convert(r);
                }
                if (n < 1000000) {
                    let mil = Math.floor(n / 1000);
                    let r = n % 1000;
                    let milWord = mil === 1 ? "mil" : convert(mil) + " mil";
                    if (milWord.endsWith("un mil")) {
                        milWord = milWord.substring(0, milWord.length - 6) + "ún mil";
                    } else if (milWord.startsWith("un mil")) {
                        milWord = "mil";
                    }
                    if (r === 0) return milWord;
                    return milWord + " " + convert(r);
                }
                if (n < 1000000000) {
                    let mill = Math.floor(n / 1000000);
                    let r = n % 1000000;
                    let millWord = mill === 1 ? "un millón" : convert(mill) + " millones";
                    if (millWord.endsWith("un millones")) {
                        millWord = millWord.substring(0, millWord.length - 11) + "ún millones";
                    }
                    if (r === 0) return millWord;
                    return millWord + " " + convert(r);
                }
                return String(n);
            }
            
            let integerPart = Math.floor(num);
            let fract = Math.round((num % 1) * 100);
            
            let word = "";
            if (integerPart === 0) {
                word = "cero";
            } else {
                word = convert(integerPart);
            }
            
            word += integerPart === 1 ? " peso colombiano" : " pesos colombianos";
            
            if (fract > 0) {
                word += " con " + (fract === 0 ? "cero" : convert(fract));
                word += fract === 1 ? " centavo" : " centavos";
            }
            
            return word.charAt(0).toUpperCase() + word.slice(1);
        }

        // Initialize preview on page load if editing product
        window.addEventListener("DOMContentLoaded", () => {
            const priceVal = document.getElementById("price").value;
            if (priceVal) {
                updateLivePricePreview(priceVal);
            }
        });
    </script>
</body>
</html>
