<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo de Productos')}">
</head>
<body>

    <header th:replace="~{fragments/layout :: header('catalog')}"></header>

    <div class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
        <h1 style="font-size: 2.5rem; margin-bottom: 2rem; font-weight: 700; color: #0f172a;">Catálogo de Productos</h1>

        <!-- Search and filters panel -->
        <style>
            .filter-grid-container {
                display: grid; 
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
                gap: 1.5rem; 
                align-items: end;
            }
            @media (max-width: 768px) {
                .filter-grid-container {
                    grid-template-columns: 1fr;
                    gap: 1.25rem;
                }
                .filter-panel-card {
                    padding: 1.25rem !important;
                }
            }
        </style>
        <div class="filter-panel-card" style="background-color: white; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 2rem; margin-bottom: 3rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
            <form action="/catalogo" method="get" class="filter-grid-container">
                
                <!-- Query search -->
                <div>
                    <label style="display: block; font-weight: 500; font-size: 0.875rem; margin-bottom: 0.5rem; color: #475569;">Búsqueda por texto</label>
                    <div class="search-wrapper">
                        <input type="text" name="buscar" th:value="${searchQuery}" placeholder="Acetaminofén, Redoxon..." style="width: 100%; border: 1px solid #cbd5e1; padding: 0.625rem; border-radius: 0.5rem; outline: none; font-size: 0.95rem; box-sizing: border-box;">
                    </div>
                </div>

                <!-- Category filter -->
                <div>
                    <label style="display: block; font-weight: 500; font-size: 0.875rem; margin-bottom: 0.5rem; color: #475569;">Categoría</label>
                    <select name="categoria" style="width: 100%; border: 1px solid #cbd5e1; padding: 0.625rem; border-radius: 0.5rem; outline: none; font-size: 0.95rem; box-sizing: border-box;">
                        <option value="">Todas las Categorías</option>
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == selectedCategory}"></option>
                    </select>
                </div>

                <!-- Sorting option -->
                <div>
                    <label style="display: block; font-weight: 500; font-size: 0.875rem; margin-bottom: 0.5rem; color: #475569;">Ordenar por</label>
                    <select name="orden" style="width: 100%; border: 1px solid #cbd5e1; padding: 0.625rem; border-radius: 0.5rem; outline: none; font-size: 0.95rem; box-sizing: border-box;">
                        <option value="relevante" th:selected="${selectedSort == 'relevante'}">Relevancia / Nombre A-Z</option>
                        <option value="precio_menor" th:selected="${selectedSort == 'precio_menor'}">Menor precio</option>
                        <option value="precio_mayor" th:selected="${selectedSort == 'precio_mayor'}">Mayor precio</option>
                        <option value="mas_recientes" th:selected="${selectedSort == 'mas_recientes'}">Más recientes</option>
                    </select>
                </div>

                <!-- Action button -->
                <div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fa-solid fa-filter"></i> Aplicar Filtros
                    </button>
                </div>
            </form>
        </div>

        <!-- Products Grid -->
        <div th:if="${not #lists.isEmpty(productPage.content)}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem;">
            <div th:each="product : ${productPage.content}" style="background-color: white; border: 1px solid #e2e8f0; border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column;">
                <img th:src="${product.imageUrl}" th:alt="${product.name}" style="width: 100%; height: 200px; object-fit: cover;">
                <div style="padding: 1.5rem; display: flex; flex-direction: column; flex: 1;">
                    <!-- Badge for availability -->
                    <div style="margin-bottom: 0.75rem;">
                        <span th:if="${product.stock > 5}" class="badge" style="background-color: #d1fae5; color: #065f46; padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;">🟢 Disponible</span>
                        <span th:if="${product.stock > 0 && product.stock <= 5}" class="badge" style="background-color: #fef3c7; color: #92400e; padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;">🟡 Poco Stock</span>
                        <span th:if="${product.stock == 0}" class="badge" style="background-color: #ffe4e6; color: #991b1b; padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;">🔴 Agotado</span>
                    </div>

                    <h3 th:text="${product.name}" style="font-size: 1.25rem; margin-bottom: 0.5rem; font-weight: 600; color: #0f172a;"></h3>
                    <p th:text="${product.brand}" style="color: #64748b; font-size: 0.875rem; margin-bottom: 1rem;"></p>
                    
                    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem;">
                        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;">
                            <span th:text="${currencyFormatter.format(product.price)}" style="font-size: 1.5rem; font-weight: 800; color: #0f172a;"></span>
                            <div style="display: flex; gap: 0.35rem;">
                                <a th:href="@{'/productos/' + ${product.slug}}" class="btn btn-outline btn-sm" style="padding: 0.4rem 0.75rem;">Detalles</a>
                                <a th:if="${product.stock > 0}" th:href="@{'/apartados/crear?productId=' + ${product.id}}" class="btn btn-primary btn-sm" style="padding: 0.4rem 0.75rem;">Apartar</a>
                            </div>
                        </div>
                        <span th:text="${currencyFormatter.formatToWords(product.price)}" style="font-size: 0.75rem; color: #64748b; font-weight: 500; display: block; line-height: 1.2;"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(productPage.content)}" style="text-align: center; padding: 5rem 0;">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 4rem; color: #cbd5e1; margin-bottom: 1.5rem;"></i>
            <h2 style="font-size: 1.5rem; color: #475569; margin-bottom: 0.5rem; font-weight: 600;">No encontramos productos que coincidan con tu búsqueda.</h2>
            <p style="color: #64748b;">Intenta de nuevo buscando con otro término o limpiando los filtros seleccionados.</p>
            <a href="/catalogo" class="btn btn-primary" style="margin-top: 1.5rem;">Limpiar Filtros</a>
        </div>

        <!-- Pagination -->
        <div th:if="${productPage.totalPages > 1}" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 4rem;">
            <a th:if="${productPage.hasPrevious()}" th:href="@{/catalogo(categoria=${selectedCategory}, orden=${selectedSort}, buscar=${searchQuery}, page=${productPage.number - 1})}" class="btn btn-outline btn-sm"><i class="fa-solid fa-chevron-left"></i> Anterior</a>
            <span th:text="'Página ' + (${productPage.number} + 1) + ' de ' + ${productPage.totalPages}" style="display: inline-flex; align-items: center; padding: 0 1rem; font-weight: 500; color: #475569;"></span>
            <a th:if="${productPage.hasNext()}" th:href="@{/catalogo(categoria=${selectedCategory}, orden=${selectedSort}, buscar=${searchQuery}, page=${productPage.number + 1})}" class="btn btn-outline btn-sm">Siguiente <i class="fa-solid fa-chevron-right"></i></a>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
